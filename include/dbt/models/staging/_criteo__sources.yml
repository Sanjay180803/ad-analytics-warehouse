version: 2

sources:
  - name: criteo
    description: >
      Criteo Attribution Modeling for Bidding dataset, cleaned by Spark and loaded
      by Airflow into RAW. Timestamps are anchored to var('anchor_date').
    database: raw
    schema: criteo
    tables:
      - name: impressions
        description: One row per displayed banner (impression), deduplicated by Spark.
        config:
          event_time: event_ts
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
        columns:
          - name: impression_id
            data_tests: [not_null, unique]
          - name: user_id
            config:
              meta: {pii: user_id}
          - name: dt
            data_tests: [not_null]

      - name: campaign_changes
        description: >
          Change log of campaign attributes (simulated; Criteo campaigns carry no
          attributes). One row per state change. Feeds dim_campaign SCD Type 2.
        config:
          freshness: null
        columns:
          - name: campaign_id
            data_tests: [not_null]
          - name: changed_at
            data_tests: [not_null]

      - name: impressions_stream
        description: >
          Impression events from Kafka topic ad.impressions.v1, validated against the
          data contract (include/streaming/contracts/ad_impression_event.yaml) and
          MERGEd by Spark Structured Streaming. Same grain and impression_id as
          `impressions`.
        config:
          loaded_at_field: _ingested_at
          freshness:                                   # contract SLO: p95 < 120s end to end
            warn_after: {count: 5, period: minute}
            error_after: {count: 15, period: minute}
        columns:
          - name: impression_id
            data_tests: [not_null, unique]
          - name: user_id
            config:
              meta: {pii: user_id}
          - name: schema_version
            data_tests: [not_null]

      - name: impressions_dlq
        description: Events rejected by the data contract, with reason codes. Keyed on Kafka coordinates.
        config:
          freshness: null
        columns:
          - name: reject_reason
            data_tests: [not_null]

      - name: campaign_minute_metrics
        description: Real-time 1-minute campaign aggregates from the streaming job (speed layer).
        config:
          freshness: null
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [campaign_id, window_start]
